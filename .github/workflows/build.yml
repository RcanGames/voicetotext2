
name: Build VoiceToText for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore VoiceToText.csproj

      - name: Build Windows application
        run: dotnet publish VoiceToText.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output ./publish

      - name: Include interface files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./publish/ui | Out-Null
          Copy-Item ./ui/* ./publish/ui/ -Recurse -Force

      - name: Package application
        run: Compress-Archive -Path ./publish/* -DestinationPath ./VoiceToText-Windows.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: VoiceToText-Windows
          path: VoiceToText-Windows.zip
          retention-days: 14
